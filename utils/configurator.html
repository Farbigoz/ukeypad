  <style>

<body>

<script>
(() => {
  'use strict';

  const translations = {
    ru: {
      pageTitle: 'USB HID keypad configurator', subtitle: 'Standalone Web Serial configurator. Работает в Chrome/Edge на desktop.', connect: 'Подключить CDC', disconnect: 'Отключить', clearLog: 'Очистить лог', boot: 'Перейти в bootloader', connected: 'Подключено', notConnected: 'Не подключено', hintConnect: 'Подключи keypad по USB и нажми «Подключить CDC». CDC-конфигурация и HID работают одновременно.', unsupported: 'Этот браузер не поддерживает Web Serial API. Используй Chrome или Edge на desktop.', info: 'Информация', refreshInfo: 'Обновить info', deviceDescriptor: 'Описание устройства', model: 'Модель', firmware: 'Прошивка', protocol: 'Протокол', nvsFormat: 'Формат NVS', inputs: 'Входы', leds: 'Светодиоды', scan: 'Сканирование', capabilities: 'Возможности', debounce: 'Debounce', samples: 'samples', read: 'Прочитать', apply: 'Применить', debounceHint: 'При 2000 Гц: 4 samples ≈ 2 мс. Значение сохраняется в NVS командой «Сохранить в NVS».', bindings: 'Бинды', slot: 'Слот', type: 'Тип', key: 'Клавиша', save: 'Сохранить в NVS', reset: 'Сбросить defaults', duplicates: 'Дубликаты разрешены: две физические кнопки могут иметь один HID-код.', test: 'Тест кнопок', enableTest: 'Включить test', disable: 'Выключить', testHint: 'Тест использует тот же timer 2000 Гц и integrator debounce. События появляются в отдельном поле, а HID продолжает работать.', stats: 'Статистика', clear: 'Очистить', scans: 'Сканов', events: 'Событий', overflows: 'Переполнений', queuePeak: 'Пик очереди', buttonEvents: 'События кнопок', autoScroll: 'автопрокрутка', emptyState: 'Включите test и нажмите кнопку.', cdcLog: 'Технический лог CDC', hz: ' Гц', confirmBoot: 'Перейти в ROM bootloader? Устройство отключится от USB.', cdcDisconnected: 'CDC не подключён', language: 'Язык', russian: 'RU', english: 'EN'
    },
    en: {
      pageTitle: 'USB HID keypad configurator', subtitle: 'Standalone Web Serial configurator. Works in Chrome/Edge on desktop.', connect: 'Connect CDC', disconnect: 'Disconnect', clearLog: 'Clear log', boot: 'Enter bootloader', connected: 'Connected', notConnected: 'Not connected', hintConnect: 'Connect the keypad via USB and press “Connect CDC”. CDC configuration and HID work simultaneously.', unsupported: 'This browser does not support Web Serial API. Use Chrome or Edge on desktop.', info: 'Info', refreshInfo: 'Refresh info', deviceDescriptor: 'Device descriptor', model: 'Model', firmware: 'Firmware', protocol: 'Protocol', nvsFormat: 'NVS format', inputs: 'Inputs', leds: 'LEDs', scan: 'Scan', capabilities: 'Capabilities', debounce: 'Debounce', samples: 'samples', read: 'Read', apply: 'Apply', debounceHint: 'At 2000 Hz: 4 samples ≈ 2 ms. The value is saved to NVS by “Save to NVS”.', bindings: 'Bindings', slot: 'Slot', type: 'Type', key: 'Key', save: 'Save to NVS', reset: 'Reset defaults', duplicates: 'Duplicates are allowed: two physical buttons can share one HID code.', test: 'Button test', enableTest: 'Enable test', disable: 'Disable', testHint: 'Test uses the same 2000 Hz timer and integrator debounce. Events appear separately while HID keeps working.', stats: 'Statistics', clear: 'Clear', scans: 'Scans', events: 'Events', overflows: 'Overflows', queuePeak: 'Queue peak', buttonEvents: 'Button events', autoScroll: 'auto-scroll', emptyState: 'Enable test and press a button.', cdcLog: 'CDC technical log', hz: ' Hz', confirmBoot: 'Enter ROM bootloader? The device will disconnect from USB.', cdcDisconnected: 'CDC is not connected', language: 'Language', russian: 'RU', english: 'EN'
    }
  };
  let currentLang = 'ru';
  let numberFormat = new Intl.NumberFormat('ru-RU');
  function detectLang() {
    const saved = localStorage.getItem('ukeypad_lang');
    if (saved && translations[saved]) return saved;
    const browserLang = (navigator.language || '').slice(0, 2).toLowerCase();
    return translations[browserLang] ? browserLang : 'ru';
  }
  function t(key) { return translations[currentLang][key] || translations.ru[key] || key; }
  function applyLang(lang) {
    if (!translations[lang]) return;
    currentLang = lang;
    localStorage.setItem('ukeypad_lang', lang);
    numberFormat = new Intl.NumberFormat(lang === 'ru' ? 'ru-RU' : 'en-US');
    document.documentElement.lang = lang;
    document.title = t('pageTitle');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    const selector = document.getElementById('langSelect');
    if (selector) selector.value = lang;
  }
  currentLang = detectLang();
  // Apply after the DOM is parsed; the script is bundled at the end of body.
  window.addEventListener('DOMContentLoaded', () => applyLang(currentLang));

  const MAX_UI_INPUTS = 32;
  const keys = [
    ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''), ...'0123456789'.split(''),
    ...Array.from({ length: 24 }, (_, i) => `F${i + 1}`),
    'ENTER', 'ESC', 'TAB', 'SPACE', 'BACKSPACE', 'INSERT', 'DELETE',
    'HOME', 'END', 'PAGEUP', 'PAGEDOWN', 'UP', 'DOWN', 'LEFT', 'RIGHT',
    'CAPSLOCK', 'PRINTSCREEN', 'SCROLLLOCK', 'MENU', 'MUTE', 'VOLUP', 'VOLDN',
    'CTRL', 'SHIFT', 'ALT', 'GUI', 'WIN', 'LCTRL', 'RCTRL', 'LSHIFT',
    'RSHIFT', 'LALT', 'RALT', 'ALTGR', 'LWIN', 'RWIN', 'CMD'
  ];

  let port = null;
  let reader = null;
  let keepReading = false;
  let receiveBuffer = '';
  let pending = [];
  let commandChain = Promise.resolve();
  let listing = false;
  let descriptor = null;
  let descriptorFrame = null;
  const currentBindings = new Map();
  // Number formatting is updated by the localization module.
  const infoFieldIds = ['infoModel', 'infoFirmware', 'infoProtocol', 'infoConfigVersion', 'infoInputs', 'infoLeds', 'infoScan', 'infoUsb', 'infoCapabilities'];
  const statsFieldIds = ['statsScan', 'statsEvents', 'statsOverflow', 'statsQueue'];

  function parseFields(line) {
    const fields = {};
    line.replace(/([a-z_]+)=([^ ]+)/g, (_, key, value) => { fields[key] = value; return ''; });
    return fields;
  }

  function parseDescriptorLine(line) {
    if (line === 'OK device_begin') {
      descriptorFrame = {};
      return;
    }
    if (!descriptorFrame) return;
    if (line.startsWith('OK device ')) {
      descriptorFrame.device = parseFields(line.slice('OK device '.length));
    } else if (line.startsWith('OK inputs ')) {
      const fields = parseFields(line.slice('OK inputs '.length));
      descriptorFrame.inputs = {
        count: Number(fields.count),
        types: fields.types ? fields.types.split(',') : [],
        pins: fields.pins ? fields.pins.split(',').map(Number) : []
      };
    } else if (line.startsWith('OK leds ')) {
      descriptorFrame.leds = parseFields(line.slice('OK leds '.length));
    } else if (line.startsWith('OK capabilities ')) {
      descriptorFrame.capabilities = parseFields(line.slice('OK capabilities '.length));
    } else if (line === 'OK device_end') {
      try { descriptor = validateDescriptor(descriptorFrame); renderBindings(); }
      catch (error) { descriptor = null; renderBindings(); log(`ERR code=DEVICE_DESCRIPTOR_INVALID message=${error.message}`, true); }
      descriptorFrame = null;
    }
  }

  function validateDescriptor(value) {
    const device = value.device || {};
    const inputs = value.inputs || {};
    const protocol = Number(device.protocol);
    if (!device.model || !device.firmware || !Number.isInteger(protocol) || protocol !== 1) {
      throw new Error('unsupported protocol or missing device fields');
    }
    if (!Number.isInteger(inputs.count) || inputs.count < 1 || inputs.count > MAX_UI_INPUTS ||
        inputs.types.length !== inputs.count || inputs.pins.length !== inputs.count ||
        inputs.pins.some(pin => !Number.isInteger(pin))) {
      throw new Error('invalid input count, types, or pins');
    }
    return { ...value, device, inputs };
  }

  function renderBindings() {
    const body = $('bindings');
    body.replaceChildren();
    if (!descriptor) return;
    descriptor.inputs.types.forEach((type, slot) => {
      const row = document.createElement('tr');
      row.innerHTML = `<td>${slot}</td><td>${type}</td><td>GPIO${descriptor.inputs.pins[slot]}</td><td><select id="key-${slot}"></select></td>`;
      const select = row.querySelector('select');
      keys.forEach(key => {
        const option = document.createElement('option');
        option.value = key; option.textContent = key; select.appendChild(option);
      });
      body.appendChild(row);
      const binding = currentBindings.get(slot);
      if (binding && keys.includes(binding)) select.value = binding;
    });
  }

  function clearDescriptor() {
    descriptor = null;
    descriptorFrame = null;
    currentBindings.clear();
    $('bindings').replaceChildren();
  }

  const $ = id => document.getElementById(id);
  const log = (text, error = false) => {
    const stamp = new Date().toLocaleTimeString();
    $('log').textContent += `[${stamp}] ${text}\n`;
    $('log').scrollTop = $('log').scrollHeight;
    if (error) $('status').textContent = text;
  };

  function setText(id, value) {
    const element = $(id);
    if (element) element.textContent = value || '—';
  }

  function clearStructuredPanels() {
    [...infoFieldIds, ...statsFieldIds].forEach(id => setText(id, '—'));
    $('statsOverflow').classList.remove('stat-warn');
    $('events').replaceChildren();
    $('events').classList.add('empty-state');
    $('events').textContent = t('emptyState');
  }

  function renderInfo(line) {
    const fields = parseFields(line.slice('OK info '.length));
    setText('infoModel', fields.model);
    setText('infoFirmware', fields.firmware);
    setText('infoProtocol', fields.protocol);
    setText('infoConfigVersion', fields.config_version);
    setText('infoInputs', fields.input_count ? `${fields.input_count} (${fields.input_types || '—'})` : '—');
    setText('infoLeds', fields.led_count);
    setText('infoScan', fields.scan_hz ? `${numberFormat.format(Number(fields.scan_hz))} ${t('hz')}` : '—');
    setText('infoUsb', fields.usb);
    setText('infoCapabilities', fields.capabilities ? fields.capabilities.split(',').map(item => item.replace('=', ': ')).join(' · ') : '—');
  }

  function renderStats(line) {
    if (line === 'OK stats=cleared') {
      ['statsScan', 'statsEvents', 'statsOverflow', 'statsQueue'].forEach(id => setText(id, '0'));
      $('statsOverflow').classList.remove('stat-warn');
      return;
    }
    const fields = parseFields(line.slice('OK stats '.length));
    setText('statsScan', fields.scan ? numberFormat.format(Number(fields.scan)) : '—');
    setText('statsEvents', fields.events ? numberFormat.format(Number(fields.events)) : '—');
    setText('statsOverflow', fields.overflow ? numberFormat.format(Number(fields.overflow)) : '0');
    setText('statsQueue', fields.queue_max ? numberFormat.format(Number(fields.queue_max)) : '0');
    $('statsOverflow').classList.toggle('stat-warn', Number(fields.overflow) > 0);
  }

  function appendEvent(line) {
    const fields = parseFields(line.slice('OK test '.length));
    const row = document.createElement('div');
    const stamp = new Date().toLocaleTimeString(currentLang === 'ru' ? 'ru-RU' : 'en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    row.className = `event-row ${fields.event === 'PRESS' ? 'event-press' : 'event-release'}`;
    row.textContent = `[${stamp}] ${fields.event || 'EVENT'}  ${fields.key || '—'}`;
    if ($('events').classList.contains('empty-state')) {
      $('events').replaceChildren();
      $('events').classList.remove('empty-state');
    }
    $('events').appendChild(row);
    if ($('autoScrollEvents').checked) $('events').scrollTop = $('events').scrollHeight;
  }

  const setConnected = connected => {
    $('dot').classList.toggle('connected', connected);
    $('status').textContent = connected ? t('connected') : t('notConnected');
    $('connect').disabled = connected;
    $('disconnect').disabled = !connected;
    document.querySelectorAll('button:not(#connect):not(#disconnect):not(#clearLog), input, select')
      .forEach(el => { if (el.dataset.always !== 'true') el.disabled = !connected; });
  };

  async function readLoop() {
    const decoder = new TextDecoderStream();
    port.readable.pipeTo(decoder.writable).catch(() => {});
    reader = decoder.readable.getReader();
    keepReading = true;
    try {
      while (keepReading) {
        const { value, done } = await reader.read();
        if (done) break;
        receiveBuffer += value;
        const lines = receiveBuffer.split(/\r?\n/);
        receiveBuffer = lines.pop() || '';
        lines.filter(line => line.length).forEach(handleLine);
      }
    } catch (error) {
      if (keepReading) log(`ERR read ${error.message}`, true);
    } finally {
      reader.releaseLock(); reader = null;
    }
  }

  function handleLine(line) {
    log(`< ${line}`);
    parseDescriptorLine(line);
    if (line.startsWith('OK info ')) renderInfo(line);
    if (line.startsWith('OK stats ') || line === 'OK stats=cleared') renderStats(line);
    if (line.startsWith('OK test event=')) appendEvent(line);
    if (line.startsWith('Current bindings:')) listing = true;
    if (listing && line.match(/^\s*slot /)) {
      const match = line.match(/^\s*slot (\d+) -> ([^ ]+)/);
      if (match) {
        const slot = Number(match[1]);
        const binding = match[2];
        currentBindings.set(slot, binding);
        const select = $('key-' + slot);
        if (select && keys.includes(binding)) select.value = binding;
      }
    }
    if (listing && line === 'OK list') listing = false;
    if (line.startsWith('OK debounce_samples=')) {
      const value = line.match(/debounce_samples=(\d+)/)?.[1];
      if (value) $('debounceValue').value = value;
    }
    if (pending.length) {
      const request = pending[0];
      if (!request.matches || request.matches(line)) {
        pending.shift();
        request.resolve(line);
      }
    }
  }

  async function send(command, wait = false, matches = null) {
    if (!port?.writable) throw new Error(t('cdcDisconnected'));
    const writer = port.writable.getWriter();
    let response = null;
    let responsePromise = null;
    if (wait) {
      responsePromise = new Promise(resolve => {
        pending.push({ resolve, matches });
      });
    }
    try {
      log(`> ${command}`);
      await writer.write(new TextEncoder().encode(`${command}\n`));
    } finally {
      writer.releaseLock();
    }
    if (responsePromise) response = await responsePromise;
    return response;
  }

  function responseMatches(command, line) {
    if (command === 'info') return line.startsWith('OK info ');
    if (command === 'get_device') return line === 'OK device_end';
    if (command === 'list') return line === 'OK list';
    if (command === 'debounce') return line.startsWith('OK debounce_samples=');
    return line.startsWith('OK ') || line.startsWith('ERR ');
  }

  async function requestCommand(command) {
    if (!port?.writable) throw new Error(t('cdcDisconnected'));
    await send(command, true, line => responseMatches(command, line));
  }

  async function command(command) {
    if (!port?.writable) return;
    await send(command);
  }

  async function connect() {
    if (!('serial' in navigator)) { $('unsupported').hidden = false; return; }
    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 115200 });
      clearDescriptor();
      setConnected(true);
      log('OK connected baud=115200');
      readLoop();
      // Serialize startup commands: the descriptor must be received before list
      // can populate the profile-sized binding selectors.
      setTimeout(() => {
        commandChain = commandChain
          .then(() => requestCommand('info'))
          .then(() => requestCommand('get_device'))
          .then(() => requestCommand('list'))
          .then(() => requestCommand('debounce'))
          .catch(error => log(`ERR code=COMMAND_FAILED message=${error.message}`, true));
      }, 300);
    } catch (error) { log(`ERR code=CONNECT_FAILED message=${error.message}`, true); }
  }

  async function disconnect() {
    keepReading = false;
    try { if (reader) await reader.cancel(); } catch (_) {}
    try { if (port) await port.close(); } catch (_) {}
    reader = null; port = null; pending = []; clearDescriptor(); clearStructuredPanels(); setConnected(false); log('OK disconnected');
  }

  $('connect').onclick = connect;
  $('disconnect').onclick = disconnect;
  $('clearLog').onclick = () => { $('log').textContent = ''; };
  $('langSelect').onchange = event => applyLang(event.target.value);
  $('boot').onclick = async () => {
    if (!confirm(t('confirmBoot'))) return;
    await command('boot');
  };
  $('clearEvents').onclick = () => {
    $('events').replaceChildren();
    $('events').classList.add('empty-state');
    $('events').textContent = t('emptyState');
  };
  $('info').onclick = () => command('info');
  $('getDevice').onclick = () => command('get_device');
  $('readBindings').onclick = () => command('list');
  $('save').onclick = () => command('save');
  $('reset').onclick = async () => { await command('reset'); setTimeout(() => command('list'), 100); };
  $('testOn').onclick = () => command('test on');
  $('testOff').onclick = () => command('test off');
  $('readStats').onclick = () => command('stats');
  $('clearStats').onclick = () => command('stats clear');
  $('readDebounce').onclick = () => command('debounce');
  $('setDebounce').onclick = () => {
    const value = Number($('debounceValue').value);
    if (!Number.isInteger(value) || value < 1 || value > 255) {
      log('ERR code=INVALID_VALUE debounce_range=1..255', true); return;
    }
    command(`debounce set ${value}`);
  };

  $('bindings').addEventListener('change', event => {
    if (!event.target.matches('select')) return;
    const slot = Number(event.target.id.split('-')[1]);
    command(`bind ${slot} ${event.target.value}`);
  });

  if ('serial' in navigator) {
    navigator.serial.addEventListener('disconnect', event => {
      if (event.target === port) disconnect();
    });
  } else $('unsupported').hidden = false;

  clearDescriptor(); clearStructuredPanels(); setConnected(false);
})();
</script>
</body>
</html>
