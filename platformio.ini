; ============================================================================
;  ESP32-S3 SuperMini — 6-key USB HID controller
;  Arduino framework + built-in TinyUSB (USBHIDKeyboard), hardware-timer scan.
; ============================================================================

[platformio]
default_envs = esp32s3supermini

[env:esp32s3supermini]
platform        = espressif32
board           = esp32-s3-devkitc-1   ; closest official board def for the SuperMini
framework       = arduino

; ----------------------------------------------------------------------------
;  USB / TinyUSB  —  composite CDC + HID Keyboard
; ----------------------------------------------------------------------------
;  ARDUINO_USB_MODE=0 -> USB-OTG (TinyUSB). Required for HID: the board
;  default is ARDUINO_USB_MODE=1 (USB-Serial/JTAG, no HID), so it is unflagged.
;
;  ARDUINO_USB_CDC_ON_BOOT=1 -> the device enumerates as a COMPOSITE device:
;  one USB-CDC Serial interface + the HID Keyboard interface. The CDC port is
;  the configuration channel (binds are set over a text protocol, no reflashing).
;  The HID endpoint is unaffected — reports still go out at <=1 ms, so adding
;  CDC costs zero keystroke latency; it only adds a second interface.
;
;  CDC is always available for diagnostics and configuration, while HID output
;  remains active.
build_unflags   = -DARDUINO_USB_MODE=1
build_flags     =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1

; ----------------------------------------------------------------------------
;  Flash layout  —  ESP32-S3 SuperMini (QSPI flash, no PSRAM)
;  The common SuperMini has 4 MB flash. default.csv fits in 4 MB and leaves a
;  roomy factory app partition. Leave board_build.arduino.memory_type at its
;  board default (QIO flash, no PSRAM) — do NOT add -DBOARD_HAS_PSRAM.
; ----------------------------------------------------------------------------
board_build.flash_size  = 4MB
board_upload.flash_size = 4MB
board_build.partitions  = default.csv

;  If your SuperMini is an 8 MB flash variant, switch to:
;     board_build.flash_size = 8MB
;     board_build.partitions = default_8MB.csv

; ----------------------------------------------------------------------------
;  Upload / monitor
; ----------------------------------------------------------------------------
;  The SuperMini has no separate USB-UART bridge: its USB connector is the
;  ESP32-S3 native USB. To flash, put the chip in ROM download mode
;  (hold BOOT, tap RESET, release BOOT) so the USB-Serial/JTAG port enumerates
;  as a COM port, then `pio run -t upload`. esptool flashes over that port.
upload_protocol = esptool
upload_speed    = 921600
monitor_speed   = 115200

; Compile-time validation profile with eight digital inputs. The GPIO mapping is
; synthetic and is not a validated physical-board wiring profile.
[env:esp32s3supermini-profile8]
platform        = espressif32
board           = esp32-s3-devkitc-1
framework       = arduino
build_unflags   = -DARDUINO_USB_MODE=1
build_flags     =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUKEYPAD_PROFILE_8
board_build.flash_size  = 4MB
board_upload.flash_size = 4MB
board_build.partitions  = default.csv
upload_protocol = esptool
upload_speed    = 921600
monitor_speed   = 115200

; This environment intentionally repeats only build configuration; runtime
; sources remain shared with the default profile.
